<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BIC502A - Unit II Linux Mini Quiz</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header>
      <div class="course">BIC502A</div>
      <h1>Unit II Linux Mini Quiz</h1>
      <p>Test your understanding of basic Linux commands.</p>
    </header>

    <section id="startScreen" class="card">
      <h2>Student Information</h2>

      <label for="studentName">Full Name <span>*</span></label>
      <input id="studentName" type="text" placeholder="Enter your full name" autocomplete="name">

      <label for="rollNumber">Roll Number <small>(Optional)</small></label>
      <input id="rollNumber" type="text" placeholder="Enter your roll number">

      <button id="startButton" type="button">Start Quiz</button>
    </section>

    <form id="quizForm" class="hidden">
      <div id="questions"></div>
      <button id="submitButton" type="submit">Submit Quiz</button>
    </form>

    <section id="resultScreen" class="card hidden">
      <h2>Your Result</h2>
      <div id="score"></div>
      <p id="message"></p>
      <p id="submissionStatus"></p>
      <button id="againButton" type="button">Take Again</button>
    </section>
  </main>

  <script src="quiz.js"></script>
</body>
</html>
